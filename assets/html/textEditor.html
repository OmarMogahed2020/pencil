<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html,
    body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
    }

    .editor-container {
        display: flex;
        width: 100%;
        height: 100%;
    }

    .line-numbers {
        width: 45px;
        height: 100%;
        background: #0d0d0d;
        color: #555;
        padding: 0 8px calc(100vh - 60px) 0;
        text-align: right;
        font-size: 16px;
        font-family: monospace;
        line-height: 1.2;
        overflow-y: auto;
        scrollbar-width: none;
        border-right: 1px solid #222;
        user-select: none;
        white-space: pre;
        flex-shrink: 0;
    }

    .line-numbers .current-line {
        color: #e0e0e0;
    }

    textarea {
        flex: 1;
        height: 100%;
        background: #0d0d0d;
        color: #e0e0e0;
        padding: 0;
        border: none;
        outline: none;
        font-size: 16px;
        font-family: monospace;
        line-height: 1.2;
        resize: none;
        display: block;
        margin: 0;
        padding-bottom: calc(100vh - 60px);
    }

    textarea::-webkit-scrollbar {
        width: 16px;
    }

    textarea::-webkit-scrollbar-track {
        background: #1e1e1e;
    }

    textarea::-webkit-scrollbar-thumb {
        background-color: #424242;
        border: 2px solid #1e1e1e;
    }

    textarea::-webkit-scrollbar-thumb:hover {
        background-color: #4f4f4f;
    }

    textarea::-webkit-scrollbar-thumb:pressed {
        background-color: #5a5a5a;
    }

    textarea::-webkit-scrollbar-corner {
        background: #1e1e1e;
    }
</style>
<div class="editor-container" id="editor-container">
    <div class="line-numbers" id="lineNumbers">1</div>
    <textarea id="editor" spellcheck="false"></textarea>
</div>
<script>
    var textarea = document.getElementById('editor');
    var lineNumbers = document.getElementById('lineNumbers');
    var currentLine = 1;

    function updateLineNumbers() {
        var lines = textarea.value.split('\n').length;
        var html = '';
        for (var i = 1; i <= lines; i++) {
            html += i + '\n';
        }
        lineNumbers.textContent = html;
    }

    function highlightCurrentLine() {
        var cursorPos = textarea.selectionStart;
        var textBeforeCursor = textarea.value.substring(0, cursorPos);
        var newLine = textBeforeCursor.split('\n').length;
        currentLine = newLine;
        var lines = lineNumbers.textContent.split('\n');
        var html = '';
        for (var i = 1; i <= lines.length - 1; i++) {
            if (i === currentLine) {
                html += '<span class="current-line">' + i + '</span>\n';
            } else {
                html += i + '\n';
            }
        }
        lineNumbers.innerHTML = html;
    }

    function syncScroll() {
        lineNumbers.scrollTop = textarea.scrollTop;
    }

    textarea.addEventListener('input', function () {
        updateLineNumbers();
        highlightCurrentLine();
        syncScroll();
    });
    textarea.addEventListener('scroll', syncScroll);
    textarea.addEventListener('click', highlightCurrentLine);
    textarea.addEventListener('keyup', highlightCurrentLine);
    textarea.addEventListener('keydown', highlightCurrentLine);
    textarea.addEventListener('select', highlightCurrentLine);
    updateLineNumbers();
    highlightCurrentLine();
</script>
