<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <!-- Off-white background -->
  <rect width="300" height="300" fill="#f5f0e8"/>
  
  <!-- File frame - properly connected -->
  <g stroke="#050505" fill="none" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <!-- Left side - bottom part -->
    <line x1="70" y1="275" x2="70" y2="170"/>
    <!-- Left side - top part -->
    <line x1="70" y1="45" x2="70" y2="140"/>
    <!-- Bottom -->
    <line x1="70" y1="275" x2="235" y2="275"/>
    <!-- Right side -->
    <line x1="235" y1="95" x2="235" y2="275"/>
    <!-- Top -->
    <line x1="70" y1="45" x2="185" y2="45"/>
    <!-- Folded corner -->
    <line x1="185" y1="45" x2="235" y2="95"/>
  </g>
  
  <!-- "pencil" text -->
  <text x="152" y="180" font-family="monospace, sans-serif" font-size="18" fill="#D4802A" text-anchor="middle" font-weight="bold">pencil</text>
  
  <!-- PENCIL -->
  <g transform="translate(45, 155)">
    <!-- Eraser -->
    <rect x="-8" y="-5" width="8" height="10" rx="1.5" fill="#EF5350"/>
    <rect x="-8" y="-5" width="8" height="2.5" fill="#FF8BA3" opacity="0.3"/>
    
    <!-- Metal band -->
    <rect x="0" y="-5.5" width="5" height="11" fill="#BDBDBD"/>
    <line x1="0" y1="-2.5" x2="5" y2="-2.5" stroke="#9E9E9E" stroke-width="0.4"/>
    <line x1="0" y1="0" x2="5" y2="0" stroke="#9E9E9E" stroke-width="0.4"/>
    <line x1="0" y1="2.5" x2="5" y2="2.5" stroke="#9E9E9E" stroke-width="0.4"/>
    
    <!-- Yellow body -->
    <rect x="5" y="-6" width="100" height="12" fill="#FDD835"/>
    
    <!-- Highlight -->
    <rect x="5" y="-6" width="100" height="3" fill="#FFEE58" opacity="0.3"/>
    
    <!-- Shadow -->
    <rect x="5" y="3" width="100" height="3" fill="#F9A825" opacity="0.2"/>
    
    <!-- Wood tip -->
    <polygon points="105,-6 105,6 118,0" fill="#F9A825"/>
    
    <!-- Graphite tip -->
    <polygon points="111,-3 111,3 116,0" fill="#455A64"/>
  </g>
</svg>